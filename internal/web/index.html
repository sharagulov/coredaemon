<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Core Daemon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-screen="home">
  <script>
    if (location.pathname === "/notes" || location.hash === "#notes") {
      document.body.dataset.screen = "notes";
    }
  </script>

  <div class="home">
    <header class="home__header">
      <span class="home__header-label">Меню</span>
      <div class="home__avatar" aria-hidden="true">П</div>
    </header>

    <main class="home__main">
      <h1 class="home__greeting">
        <span class="home__greeting-regular">Добро пожаловать,</span><span class="home__greeting-name"> Павел</span>
      </h1>

      <div class="home__section">
        <nav class="home__cards" aria-label="Главное меню">
          <button type="button" class="home__card" data-open="notes">
            <span class="home__icon-wrap" aria-hidden="true">
              <span class="home__icon-slot">
                <img class="home__icon" src="assets/icon-notes.svg" alt="">
              </span>
            </span>
            <span class="home__card-title">Заметки</span>
          </button>
          <button type="button" class="home__card" disabled aria-label="Облако, пока недоступно">
            <span class="home__icon-wrap" aria-hidden="true">
              <span class="home__icon-slot">
                <img class="home__icon" src="assets/icon-cloud.svg" alt="">
              </span>
            </span>
            <span class="home__card-title">Облако</span>
          </button>
        </nav>

        <form class="home__chat" aria-label="AI-помощник">
          <input
            type="text"
            class="home__chat-input"
            placeholder="Чем я могу Вам помочь?"
            disabled
            aria-disabled="true"
          >
          <span class="home__chat-ai-slot" aria-hidden="true">
            <img class="home__chat-ai" src="assets/icon-ai.png" alt="">
          </span>
        </form>
      </div>
    </main>
  </div>

  <!-- Legacy chat workspace — preserved for future Cloud section -->
  <div class="app app--legacy" hidden aria-hidden="true">
    <aside class="sidebar">
      <button type="button" class="sidebar__action sidebar__home">
        <span class="sidebar__icon sidebar__icon--home" aria-hidden="true">
          <svg viewBox="0 0 16 16"><path d="M10.5 3.5 6 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        Меню
      </button>
      <button type="button" class="sidebar__action sidebar__add">
        <span class="sidebar__icon">+</span>
        Новая заметка
      </button>
      <div class="sidebar__section">
        <div class="sidebar__label">Заметки</div>
        <ul class="sidebar__list"></ul>
      </div>
      <button type="button" class="sidebar__action sidebar__trash">
        <span class="sidebar__icon sidebar__icon--trash" aria-hidden="true">
          <svg viewBox="0 0 16 16"><path d="M5.5 3.5h5M3.5 5h9M6 7v4.5M8 7v4.5M10 7v4.5M5 5l.5 8h5L11 5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        Корзина
      </button>
    </aside>

    <main class="main">
      <section class="chat">
        <div class="chat__messages"></div>
        <form class="chat__input">
          <textarea name="message" rows="1" placeholder="Сообщение…"></textarea>
          <button type="submit" aria-label="Отправить">↑</button>
        </form>
      </section>
    </main>
  </div>

  <!-- Notes workspace -->
  <div class="notes-workspace">
    <header class="notes-header">
      <div class="notes-header__nav">
        <button type="button" class="notes-header__back notes-toolbar__home" aria-label="В главное меню">
          <span class="notes-header__chevron" aria-hidden="true">
            <img src="assets/icon-chevron.png" alt="">
          </span>
          <span>Меню</span>
        </button>
        <h1 class="notes-header__title notes-toolbar__title">Заметки</h1>
      </div>
    </header>

    <div class="notes-body">
      <aside class="notes-section" aria-label="Список заметок">
        <div class="notes-controls">
          <div class="notes-controls__left">
            <label class="notes-bar notes-bar--search">
              <span class="notes-bar__icon-slot notes-bar__icon-slot--search">
                <img src="assets/icon-search.png" alt="">
              </span>
              <input
                type="search"
                class="notes-bar__search-input notes-toolbar__search"
                placeholder="Поиск"
                autocomplete="off"
                spellcheck="false"
                aria-label="Поиск заметок"
              >
            </label>
            <button type="button" class="notes-bar notes-bar--short notes-toolbar__add" aria-label="Новая заметка">
              <span class="notes-bar__icon-slot notes-bar__icon-slot--plus">
                <img src="assets/icon-plus.png" alt="">
              </span>
            </button>
          </div>
          <div class="notes-controls__right">
            <button type="button" class="notes-bar notes-bar--dropdown notes-toolbar__trash">
              <span>Корзина</span>
            </button>
            <div class="notes-filter">
              <button
                type="button"
                class="notes-bar notes-bar--dropdown notes-toolbar__filter"
                aria-label="Фильтр по разделу"
                aria-haspopup="listbox"
                aria-expanded="false"
              >
                <span class="notes-toolbar__filter-label">Все</span>
                <span class="notes-bar__icon-slot notes-bar__icon-slot--chevron">
                  <img src="assets/icon-chevron.png" alt="">
                </span>
              </button>
              <div class="notes-filter__menu" role="listbox" aria-label="Разделы заметок" hidden></div>
            </div>
            <div class="notes-sort">
              <button
                type="button"
                class="notes-bar notes-bar--dropdown notes-toolbar__sort"
                aria-label="Сортировка заметок"
                aria-haspopup="listbox"
                aria-expanded="false"
              >
                <span class="notes-bar__sort-muted">Сортировать по </span><span class="notes-toolbar__sort-label">дате изменения</span>
                <span class="notes-bar__icon-slot notes-bar__icon-slot--chevron">
                  <img src="assets/icon-chevron.png" alt="">
                </span>
              </button>
              <div class="notes-sort__menu" role="listbox" aria-label="Варианты сортировки" hidden>
                <button type="button" class="notes-sort__option" role="option" data-sort="modified">дате изменения</button>
                <button type="button" class="notes-sort__option" role="option" data-sort="created">дате создания</button>
                <button type="button" class="notes-sort__option" role="option" data-sort="title">алфавиту от А до Я</button>
                <button type="button" class="notes-sort__option" role="option" data-sort="title-desc">алфавиту от Я до А</button>
              </div>
            </div>
          </div>
        </div>
        <div class="notes-section__scroll">
          <div class="notes-bento"></div>
        </div>
      </aside>

      <div
        class="notes-splitter"
        role="separator"
        aria-orientation="vertical"
        aria-label="Изменить ширину панелей"
        tabindex="0"
      ></div>

      <section class="notes-editor" aria-label="Редактор заметки">
        <div class="notes-reader__empty">
          <p>Выберите заметку</p>
        </div>

        <article class="notes-reader__panel" hidden>
          <div class="notes-editor__toolbar"></div>
          <div class="notes-editor__area">
            <div class="notes-editor__titlebar">
              <input
                class="notes-editor__title"
                type="text"
                spellcheck="true"
                placeholder="Имя заметки"
                maxlength="120"
              >
            </div>
            <div class="notes-editor__cm"></div>
          </div>
          <footer class="notes-reader__foot" hidden>
            <button type="button" class="notes-reader__action">Восстановить</button>
          </footer>
        </article>
      </section>
    </div>
  </div>

  <dialog class="note-modal">
    <div class="note-modal__head">
      <h2 class="note-modal__title"></h2>
      <button type="button" class="note-modal__close" aria-label="Закрыть">×</button>
    </div>
    <div class="note-modal__body"></div>
    <div class="note-modal__foot">
      <button type="button" class="note-modal__action"></button>
    </div>
  </dialog>

  <div class="notes-ctx" hidden aria-hidden="true">
    <div class="notes-ctx__menu" role="menu"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
