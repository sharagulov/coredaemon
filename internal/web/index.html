<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Core Daemon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-screen="home">
  <script>
    if (location.pathname === "/notes" || location.hash === "#notes") {
      document.body.dataset.screen = "notes";
    }
  </script>

  <div class="home">
    <nav class="home__grid" aria-label="Главное меню">
      <button type="button" class="home__card" data-open="notes">
        <span class="home__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 3.5h7.2L17.5 6.8V20.5H7z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M14.2 3.5V7h3.3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M9.5 11h5M9.5 14.5h5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </span>
        <span class="home__title">Заметки</span>
      </button>
      <button type="button" class="home__card" disabled aria-label="Облако, пока недоступно">
        <span class="home__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7.2 18.5h9.4a3.8 3.8 0 0 0 .3-7.6 5.2 5.2 0 0 0-10-1.5 3.6 3.6 0 0 0-2.8 6.2 3.5 3.5 0 0 0 3.1 2.9z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </span>
        <span class="home__title">Облако</span>
        <span class="home__hint">скоро</span>
      </button>
    </nav>
  </div>

  <!-- Legacy chat workspace — preserved for future Cloud section -->
  <div class="app app--legacy" hidden aria-hidden="true">
    <aside class="sidebar">
      <button type="button" class="sidebar__action sidebar__home">
        <span class="sidebar__icon sidebar__icon--home" aria-hidden="true">
          <svg viewBox="0 0 16 16"><path d="M10.5 3.5 6 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        Меню
      </button>
      <button type="button" class="sidebar__action sidebar__add">
        <span class="sidebar__icon">+</span>
        Новая заметка
      </button>
      <div class="sidebar__section">
        <div class="sidebar__label">Заметки</div>
        <ul class="sidebar__list"></ul>
      </div>
      <button type="button" class="sidebar__action sidebar__trash">
        <span class="sidebar__icon sidebar__icon--trash" aria-hidden="true">
          <svg viewBox="0 0 16 16"><path d="M5.5 3.5h5M3.5 5h9M6 7v4.5M8 7v4.5M10 7v4.5M5 5l.5 8h5L11 5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        Корзина
      </button>
    </aside>

    <main class="main">
      <section class="chat">
        <div class="chat__messages"></div>
        <form class="chat__input">
          <textarea name="message" rows="1" placeholder="Сообщение…"></textarea>
          <button type="submit" aria-label="Отправить">↑</button>
        </form>
      </section>
    </main>
  </div>

  <!-- Notes workspace -->
  <div class="notes-workspace">
    <header class="notes-toolbar">
      <button type="button" class="notes-toolbar__btn notes-toolbar__home" aria-label="В главное меню">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 3.5 6 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Меню
      </button>
      <h1 class="notes-toolbar__title">Заметки</h1>
      <div class="notes-toolbar__actions">
        <button type="button" class="notes-toolbar__btn notes-toolbar__trash" aria-label="Корзина">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.5h5M3.5 5h9M6 7v4.5M8 7v4.5M10 7v4.5M5 5l.5 8h5L11 5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="notes-toolbar__btn notes-toolbar__add" aria-label="Новая заметка">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="notes-split">
      <aside class="notes-browse" aria-label="Список заметок">
        <div class="notes-bento"></div>
      </aside>

      <section class="notes-reader" aria-label="Просмотр заметки">
        <div class="notes-reader__empty">
          <span class="notes-reader__empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 3.5h7.2L17.5 6.8V20.5H7z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M14.2 3.5V7h3.3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          </span>
          <p>Выберите заметку</p>
        </div>

        <article class="notes-reader__panel" hidden>
          <header class="notes-reader__head">
            <h2 class="notes-reader__title"></h2>
            <span class="notes-reader__meta"></span>
          </header>
          <div class="notes-reader__body"></div>
          <footer class="notes-reader__foot">
            <button type="button" class="notes-reader__action"></button>
          </footer>
        </article>
      </section>
    </div>
  </div>

  <dialog class="note-modal">
    <div class="note-modal__head">
      <h2 class="note-modal__title"></h2>
      <button type="button" class="note-modal__close" aria-label="Закрыть">×</button>
    </div>
    <div class="note-modal__body"></div>
    <div class="note-modal__foot">
      <button type="button" class="note-modal__action"></button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
